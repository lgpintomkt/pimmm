[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pimmm"
version = "1.0.0"
description = "Physics-Informed Marketing Mix Modeling in Python"
readme = "README.md"
authors = [
    { name = "Luis Pinto" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]